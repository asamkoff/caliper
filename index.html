
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Vernier Caliper</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 850px;
    margin: 24px auto;
    padding: 0 16px;
    color: #222;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #ccc;
    border-radius: 10px;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }

  svg.dragging { cursor: grabbing; }

  button {
    padding: 7px 13px;
    margin-top: 10px;
    cursor: pointer;
  }

  #reading {
    font-size: 22px;
    font-weight: 650;
    margin-top: 8px;
  }
</style>
</head>
<body>

<h2>Interactive Vernier Caliper</h2>

<svg id="caliper" viewBox="0 0 760 244"
     role="img" aria-label="Interactive Vernier caliper">

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf1f4"/>
      <stop offset="100%" stop-color="#b7c0c8"/>
    </linearGradient>
  </defs>

  <!-- =================================================
       CALIPER HEAD GEOMETRY
       EDIT THESE PATHS TO REDRAW THE JAWS.
       Fixed jaw face: x = 210
       Moving jaw face at zero: x = 210
       ================================================= -->

  <g id="fixed-jaw">
    <!-- Replace this path with your own fixed jaw shape -->
     <!-- top left corner first, then go counterclockwise -->
    <path d="
      M 160,20
      V 80
      L 185,180
      H 200
      V 100
      H 190
      V 62
      H 210
      V 20
      H 172
      Z"
      fill="url(#metal)" stroke="#737e88" stroke-width="1.2"/>

      <!-- Inner jaw surface -->
      <path d="M 200,160 H 190 V 180 H 200 Z"
            fill="#d9dfe4" stroke="#737e88"/>
  </g>

  

  <!-- Main scale beam -->
  <rect x="210" y="20" width="480" height="42"
        rx="2" fill="url(#metal)" stroke="#7c8792"/>

  <!-- Main scale ticks and labels -->
  <g id="main-ticks"></g>

  <!-- Moving Vernier assembly -->
  <g id="slider">

    <rect x="0" y="62" width="480" height="26"
          rx="2" fill="#d9efff" stroke="#6b9fc2"/>

    <g id="vernier-ticks"></g>

    <!-- ==============================================
         MOVING JAW GEOMETRY
         This entire group moves with the Vernier scale.
         Its measuring face is x = 0.
         At zero, x = 210, matching the fixed jaw face.
         ============================================== -->

    <g id="moving-jaw">
      <!-- Replace this path with your own moving jaw shape -->
      <path d="
        M 0,88
        V 100
        H -10
        V 180
        H 12
        L 30, 100
        V 88
        H 0
        Z"
        fill="url(#metal)" stroke="#737e88" stroke-width="1.2"/>

      <!-- Inner jaw surface -->
      <path d="M 0,160 H -10 V 180 H 0 Z"
            fill="#d9dfe4" stroke="#737e88"/>
    </g>
  </g>

  <!-- Red Vernier zero line -->
  <line id="zero-line"
        x1="210" y1="48" x2="210" y2="110"
        stroke="#dc4444" stroke-width="1.6"
        stroke-dasharray="5 4"/>

  <text x="210" y="19" text-anchor="middle"
        font-size="11" fill="#dc4444">0</text>

  <!-- Pink highlight overlay: always drawn above the slider -->
  <g id="highlight-overlay" pointer-events="none"></g>

  <text x="210" y="211" text-anchor="middle"
        font-size="11" fill="#666">Vernier zero</text>

  <text x="450" y="226" text-anchor="middle"
        font-size="11" fill="#666">
    Drag the Vernier assembly to measure
  </text>
</svg>

<div id="reading">0.00 cm</div>
<button id="reset">Reset to 0</button>

<script>
(() => {
  const svg = document.getElementById("caliper");
  const mainTicks = document.getElementById("main-ticks");
  const vernierTicks = document.getElementById("vernier-ticks");
  const slider = document.getElementById("slider");
  const zeroLine = document.getElementById("zero-line");
  const highlights = document.getElementById("highlight-overlay");
  const reading = document.getElementById("reading");

  const NS = "http://www.w3.org/2000/svg";

  // Scale geometry
  const X0 = 210;
  const PIXELS_PER_CM = 24;
  const MAX_CM = 19;
  const DRAG_STEP = 0.02;

  let cm = 0;
  let dragging = false;
  let startX = 0;
  let startCm = 0;

let audioContext = null;
let lastClickCm = 0;

function playCaliperClick() {
  // Create audio only after the user interacts with the page.
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  // Short, sharp mechanical click.
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(1000, now);
  oscillator.frequency.exponentialRampToValueAtTime(650, now + 0.018);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.22, now + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.03);
}

  function addSvg(parent, tag, attrs, text = "") {
    const el = document.createElementNS(NS, tag);

    for (const [key, value] of Object.entries(attrs)) {
      el.setAttribute(key, value);
    }

    if (text !== "") el.textContent = text;

    parent.appendChild(el);
    return el;
  }

  // Main scale: labels 1 through 20; no zero tick.
  for (let i = 1; i <= 20; i++) {
    const x = X0 + i * PIXELS_PER_CM;

    addSvg(mainTicks, "line", {
      x1: x, y1: 62, x2: x,
      // so cute: i % 5 === 0 ? 38 : 46 means "if i is a multiple of 5, y2 = 38, else y2 = 46"
      y2: i % 5 === 0 ? 38 : 46,
      stroke: "#36414b",
      "stroke-width": i % 5 === 0 ? 1.5 : 1
    });

    addSvg(mainTicks, "text", {
      x, y: 34,
      "text-anchor": "middle",
      "font-size": 11,
      fill: "#222"
    }, String(i));
  }

  // Vernier: 10 intervals across 9 main-scale intervals.
  for (let j = 0; j <= 10; j++) {
    const x = j * PIXELS_PER_CM * 0.9;

    addSvg(vernierTicks, "line", {
      x1: x, y1: 62, x2: x,
      y2: j % 5 === 0  ? 79 : 72,
      stroke: "#315b77",
      "stroke-width": j % 5 === 0 ? 1.5 : 1
    });

    addSvg(vernierTicks, "text", {
      x, y: 87,
      "text-anchor": "middle",
      "font-size": 11,
      fill: "#222"
    }, String(j));
  }

  function update(showHighlights = true) {
    const whole = Math.floor(cm + 1e-7);
    const fraction = cm - whole;

    // Highlight the corresponding Vernier interval.
    const j = Math.min(9, Math.floor(fraction * 10 + 1e-7));

    const zeroX = X0 + cm * PIXELS_PER_CM;

    slider.setAttribute("transform", `translate(${zeroX}, 0)`);
    zeroLine.setAttribute("x1", zeroX);
    zeroLine.setAttribute("x2", zeroX);
    reading.textContent = cm.toFixed(2) + "cm";

    highlights.replaceChildren();

    if (!showHighlights) return;

    // Pink main-scale tick: whole-cm measurement.
    const mainX = X0 + whole * PIXELS_PER_CM;

    addSvg(highlights, "line", {
      x1: mainX, y1: 38,
      x2: mainX, y2: 62,
      stroke: "#ec72ad",
      "stroke-width": 4,
      "stroke-linecap": "round"
    });

    // Pink Vernier tick: calculated in global SVG coordinates.
    const vernierX =
      zeroX + j * PIXELS_PER_CM * 0.9;

    addSvg(highlights, "line", {
      x1: vernierX, y1: 62,
      x2: vernierX, y2: 75,
      stroke: "#ec72ad",
      "stroke-width": 4,
      "stroke-linecap": "round"
    });

  
  }

  function svgX(event) {
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;

    return point.matrixTransform(
      svg.getScreenCTM().inverse()
    ).x;
  }
  let previousCm = cm;

  svg.addEventListener("pointerdown", event => {
    dragging = true;
    startX = svgX(event);
    startCm = cm;
    previousCm = cm;

    svg.classList.add("dragging");
    svg.setPointerCapture(event.pointerId);
    update(false);
  });

  svg.addEventListener("pointermove", event => {
    if (!dragging) return;

      const deltaCm = (svgX(event) - startX) / PIXELS_PER_CM;

    cm = Math.max(
      0,
      Math.min(
        MAX_CM,
        Math.round((startCm + deltaCm) / DRAG_STEP) * DRAG_STEP
      )
    );
    
    //multiply by 10 to get more clicks
    const oldStep = Math.floor(previousCm * 5 + 1e-7);
    const newStep = Math.floor(cm * 5 + 1e-7);

    if (oldStep !== newStep) {
      const count = Math.abs(newStep - oldStep);

      for (let i = 0; i < count; i++) {
        playCaliperClick();
      }
    } 
    previousCm = cm;

    update(false);
  });

  function finishDrag() {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove("dragging");
    update(true);
  }

  svg.addEventListener("pointerup", finishDrag);
  svg.addEventListener("pointercancel", finishDrag);

  document.getElementById("reset").addEventListener("click", () => {
    cm = 0;
    dragging = false;
    update(true);
  });

  update(true);
})();
</script>

</body>
</html>
