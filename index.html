
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Vernier Caliper</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 850px;
    margin: 24px auto;
    padding: 0 16px;
    color: #222;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #ccc;
    border-radius: 10px;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }

  svg.dragging { cursor: grabbing; }

  button {
    padding: 7px 13px;
    margin-top: 10px;
    cursor: pointer;
  }

  #reading {
    font-size: 22px;
    font-weight: 650;
    margin-top: 8px;
  }

  #audio-settings {
    display: grid;
    gap: 10px;
    margin-top: 12px;
    max-width: 520px;
  }

  .audio-control {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) auto;
    align-items: center;
    gap: 4px 12px;
  }

  .audio-control input {
    grid-column: 1 / -1;
    width: 100%;
  }

  .audio-control select {
    min-width: 130px;
  }
</style>
</head>
<body>

<h2>Interactive Vernier Caliper</h2>

<svg id="caliper" viewBox="0 0 760 244"
     role="img" aria-label="Interactive Vernier caliper">

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf1f4"/>
      <stop offset="100%" stop-color="#b7c0c8"/>
    </linearGradient>
  </defs>

  <!-- =================================================
       CALIPER HEAD GEOMETRY
       EDIT THESE PATHS TO REDRAW THE JAWS.
       Fixed jaw face: x = 210
       Moving jaw face at zero: x = 210
       ================================================= -->

  <g id="fixed-jaw">
    <!-- Replace this path with your own fixed jaw shape -->
     <!-- top left corner first, then go counterclockwise -->
    <path d="
      M 160,20
      V 80
      L 185,180
      H 200
      V 100
      H 190
      V 62
      H 210
      V 20
      H 172
      Z"
      fill="url(#metal)" stroke="#737e88" stroke-width="1.2"/>

      <!-- Inner jaw surface -->
      <path d="M 200,160 H 190 V 180 H 200 Z"
            fill="#d9dfe4" stroke="#737e88"/>
  </g>

  

  <!-- Main scale beam -->
  <rect x="210" y="20" width="480" height="42"
        rx="2" fill="url(#metal)" stroke="#7c8792"/>

  <!-- Main scale ticks and labels -->
  <g id="main-ticks"></g>

  <!-- Moving Vernier assembly -->
  <g id="slider">

    <rect x="0" y="62" width="480" height="26"
          rx="2" fill="#d9efff" stroke="#6b9fc2"/>

    <g id="vernier-ticks"></g>

    <!-- ==============================================
         MOVING JAW GEOMETRY
         This entire group moves with the Vernier scale.
         Its measuring face is x = 0.
         At zero, x = 210, matching the fixed jaw face.
         ============================================== -->

    <g id="moving-jaw">
      <!-- Replace this path with your own moving jaw shape -->
      <path d="
        M 0,88
        V 100
        H -10
        V 180
        H 12
        L 30, 100
        V 88
        H 0
        Z"
        fill="url(#metal)" stroke="#737e88" stroke-width="1.2"/>

      <!-- Inner jaw surface -->
      <path d="M 0,160 H -10 V 180 H 0 Z"
            fill="#d9dfe4" stroke="#737e88"/>
    </g>
  </g>

  <!-- Red Vernier zero line -->
  <line id="zero-line"
        x1="210" y1="48" x2="210" y2="110"
        stroke="#dc4444" stroke-width="1.6"
        stroke-dasharray="5 4"/>

  <text x="210" y="19" text-anchor="middle"
        font-size="11" fill="#dc4444">0</text>

  <!-- Pink highlight overlay: always drawn above the slider -->
  <g id="highlight-overlay" pointer-events="none"></g>
</svg>

<div id="reading">0.00 cm</div>
<button id="reset">Reset to 0</button>
<button id="randomize-audio">Randomize audio settings</button>
<section id="audio-settings" aria-label="Click audio settings">
  <h3>Click audio settings</h3>
  <div class="audio-control">
    <label for="oscillator-type">Oscillator type</label>
    <select id="oscillator-type">
      <option value="sine">Sine</option>
      <option value="triangle">Triangle</option>
      <option value="square">Square</option>
      <option value="sawtooth">Sawtooth</option>
    </select>
  </div>
  <div class="audio-control">
    <label for="oscillator-frequency">Oscillator frequency</label>
    <output id="oscillator-frequency-value" for="oscillator-frequency"></output>
    <input id="oscillator-frequency" type="range" min="200" max="2000" step="10" value="1000">
  </div>
  <div class="audio-control">
    <label for="oscillator-ramp">Oscillator exponentialRamp value</label>
    <output id="oscillator-ramp-value" for="oscillator-ramp"></output>
    <input id="oscillator-ramp" type="range" min="100" max="1600" step="10" value="650">
  </div>
  <div class="audio-control">
    <label for="gain-value">Gain value</label>
    <output id="gain-value-display" for="gain-value"></output>
    <input id="gain-value" type="range" min="0.00005" max="0.001" step="0.00001" value="0.0001">
  </div>
  <div class="audio-control">
    <label for="gain-ramp1">Gain ramp1</label>
    <output id="gain-ramp1-value" for="gain-ramp1"></output>
    <input id="gain-ramp1" type="range" min="0.05" max="0.4" step="0.001" value="0.22">
  </div>
  <div class="audio-control">
    <label for="gain-ramp2">Gain ramp2</label>
    <output id="gain-ramp2-value" for="gain-ramp2"></output>
    <input id="gain-ramp2" type="range" min="0.00005" max="0.01" step="0.00001" value="0.0001">
  </div>
</section>

<script>
(() => {
  const svg = document.getElementById("caliper");
  const mainTicks = document.getElementById("main-ticks");
  const vernierTicks = document.getElementById("vernier-ticks");
  const slider = document.getElementById("slider");
  const zeroLine = document.getElementById("zero-line");
  const highlights = document.getElementById("highlight-overlay");
  const reading = document.getElementById("reading");
  const randomizeAudioButton = document.getElementById("randomize-audio");
  const oscillatorTypeControl = document.getElementById("oscillator-type");
  const audioSliderControls = [
    { setting: "oscillatorFrequency", input: document.getElementById("oscillator-frequency"), output: document.getElementById("oscillator-frequency-value"), unit: " Hz" },
    { setting: "oscillatorRamp", input: document.getElementById("oscillator-ramp"), output: document.getElementById("oscillator-ramp-value"), unit: " Hz" },
    { setting: "gainValue", input: document.getElementById("gain-value"), output: document.getElementById("gain-value-display"), unit: "" },
    { setting: "gainRamp1", input: document.getElementById("gain-ramp1"), output: document.getElementById("gain-ramp1-value"), unit: "" },
    { setting: "gainRamp2", input: document.getElementById("gain-ramp2"), output: document.getElementById("gain-ramp2-value"), unit: "" }
  ];

  const NS = "http://www.w3.org/2000/svg";
  const oscillatorTypes = ["sine", "triangle", "square", "sawtooth"];
  //Interesting parameters:
//   Oscillator type: sine
// Oscillator frequency: 893 Hz
// Oscillator exponentialRamp value: 1099 Hz
// Gain value: 0.00012
// Gain ramp1: 0.284
// Gain ramp2: 0.00151
  const clickAudioSettings = {
    oscillatorType: "sine",
    oscillatorFrequency: 1000,
    oscillatorRamp: 650,
    gainValue: 0.0001,
    gainRamp1: 0.22,
    gainRamp2: 0.0001
  };

  function syncAudioSettingsControls() {
    oscillatorTypeControl.value = clickAudioSettings.oscillatorType;
    for (const control of audioSliderControls) {
      control.input.value = String(clickAudioSettings[control.setting]);
      control.output.textContent = control.input.value + control.unit;
    }
  }

  oscillatorTypeControl.addEventListener("change", () => {
    clickAudioSettings.oscillatorType = oscillatorTypeControl.value;
  });

  for (const control of audioSliderControls) {
    control.input.addEventListener("input", () => {
      clickAudioSettings[control.setting] = Number(control.input.value);
      control.output.textContent = control.input.value + control.unit;
    });
  }

  function randomNumber(min, max, step) {
    const numberOfSteps = Math.round((max - min) / step);
    const decimalPlaces = (String(step).split(".")[1] || "").length;
    const randomStep = Math.floor(Math.random() * (numberOfSteps + 1));
    return Number((min + randomStep * step).toFixed(decimalPlaces));
  }

  randomizeAudioButton.addEventListener("click", () => {
    clickAudioSettings.oscillatorType =
      oscillatorTypes[Math.floor(Math.random() * oscillatorTypes.length)];
    for (const control of audioSliderControls) {
      clickAudioSettings[control.setting] = randomNumber(
        Number(control.input.min),
        Number(control.input.max),
        Number(control.input.step)
      );
    }
    syncAudioSettingsControls();
  });

  syncAudioSettingsControls();

  // Scale geometry
  const X0 = 210;
  const PIXELS_PER_CM = 24;
  const MAX_CM = 19;
  const DRAG_STEP = 0.02;

  let cm = 0;
  let dragging = false;
  let startX = 0;
  let startCm = 0;

let audioContext = null;
let lastClickCm = 0;

function playCaliperClick() {
  // Create audio only after the user interacts with the page.
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  // Short, sharp mechanical click.
  oscillator.type = clickAudioSettings.oscillatorType;
  oscillator.frequency.setValueAtTime(clickAudioSettings.oscillatorFrequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(clickAudioSettings.oscillatorRamp, now + 0.018);

  gain.gain.setValueAtTime(clickAudioSettings.gainValue, now);
  gain.gain.exponentialRampToValueAtTime(clickAudioSettings.gainRamp1, now + 0.002);
  gain.gain.exponentialRampToValueAtTime(clickAudioSettings.gainRamp2, now + 0.025);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.03);
}

  function addSvg(parent, tag, attrs, text = "") {
    const el = document.createElementNS(NS, tag);

    for (const [key, value] of Object.entries(attrs)) {
      el.setAttribute(key, value);
    }

    if (text !== "") el.textContent = text;

    parent.appendChild(el);
    return el;
  }

  // Main scale: labels 1 through 20; no zero tick.
  for (let i = 1; i <= 20; i++) {
    const x = X0 + i * PIXELS_PER_CM;

    addSvg(mainTicks, "line", {
      x1: x, y1: 62, x2: x,
      // so cute: i % 5 === 0 ? 38 : 46 means "if i is a multiple of 5, y2 = 38, else y2 = 46"
      y2: i % 5 === 0 ? 38 : 46,
      stroke: "#36414b",
      "stroke-width": i % 5 === 0 ? 1.5 : 1
    });

    addSvg(mainTicks, "text", {
      x, y: 34,
      "text-anchor": "middle",
      "font-size": 11,
      fill: "#222"
    }, String(i));
  }

  // Vernier: 10 intervals across 9 main-scale intervals.
  for (let j = 0; j <= 10; j++) {
    const x = j * PIXELS_PER_CM * 0.9;

    addSvg(vernierTicks, "line", {
      x1: x, y1: 62, x2: x,
      y2: j % 5 === 0  ? 79 : 72,
      stroke: "#315b77",
      "stroke-width": j % 5 === 0 ? 1.5 : 1
    });

    addSvg(vernierTicks, "text", {
      x, y: 87,
      "text-anchor": "middle",
      "font-size": 11,
      fill: "#222"
    }, String(j));
  }

  function update(showHighlights = true) {
    const whole = Math.floor(cm + 1e-7);
    const fraction = cm - whole;

    // Highlight the corresponding Vernier interval.
    const j = Math.min(9, Math.floor(fraction * 10 + 1e-7));

    const zeroX = X0 + cm * PIXELS_PER_CM;

    slider.setAttribute("transform", `translate(${zeroX}, 0)`);
    zeroLine.setAttribute("x1", zeroX);
    zeroLine.setAttribute("x2", zeroX);
    reading.textContent = cm.toFixed(2) + "cm";

    highlights.replaceChildren();

    if (!showHighlights) return;

    // Pink main-scale tick: whole-cm measurement.
    const mainX = X0 + whole * PIXELS_PER_CM;

    addSvg(highlights, "line", {
      x1: mainX, y1: 38,
      x2: mainX, y2: 62,
      stroke: "#ec72ad",
      "stroke-width": 4,
      "stroke-linecap": "round"
    });

    // Pink Vernier tick: calculated in global SVG coordinates.
    const vernierX =
      zeroX + j * PIXELS_PER_CM * 0.9;

    addSvg(highlights, "line", {
      x1: vernierX, y1: 62,
      x2: vernierX, y2: 75,
      stroke: "#ec72ad",
      "stroke-width": 4,
      "stroke-linecap": "round"
    });

  
  }

  function svgX(event) {
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;

    return point.matrixTransform(
      svg.getScreenCTM().inverse()
    ).x;
  }
  let previousCm = cm;

  svg.addEventListener("pointerdown", event => {
    dragging = true;
    startX = svgX(event);
    startCm = cm;
    previousCm = cm;

    svg.classList.add("dragging");
    svg.setPointerCapture(event.pointerId);
    update(false);
  });

  svg.addEventListener("pointermove", event => {
    if (!dragging) return;

      const deltaCm = (svgX(event) - startX) / PIXELS_PER_CM;

    cm = Math.max(
      0,
      Math.min(
        MAX_CM,
        Math.round((startCm + deltaCm) / DRAG_STEP) * DRAG_STEP
      )
    );
    
    //multiply by 10 to get more clicks
    const oldStep = Math.floor(previousCm * 5 + 1e-7);
    const newStep = Math.floor(cm * 5 + 1e-7);

    if (oldStep !== newStep) {
      const count = Math.abs(newStep - oldStep);

      for (let i = 0; i < count; i++) {
        playCaliperClick();
      }
    } 
    previousCm = cm;

    update(false);
  });

  function finishDrag() {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove("dragging");
    update(true);
  }

  svg.addEventListener("pointerup", finishDrag);
  svg.addEventListener("pointercancel", finishDrag);

  document.getElementById("reset").addEventListener("click", () => {
    cm = 0;
    dragging = false;
    update(true);
  });

  update(true);
})();
</script>

</body>
</html>
